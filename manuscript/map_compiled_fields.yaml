    db_field: "scope"
  scope_lichen:
    db_table: "scope"
    db_field: "scope"
  veg_observer:
    db_table: "personnel"
    db_field: "personnel"
    definition: "First and last name of vegetation observer."
  veg_recorder:
    db_table: "personnel"
    db_field: "personnel"
    definition: "First and last name of vegetation recorder."
  env_observer:
    db_table: "personnel"
    db_field: "personnel"
    definition: "First and last name of environmental observer."
  soils_observer:
    db_table: "personnel"
    db_field: "personnel"
    definition: "First and last name of soils observer."
