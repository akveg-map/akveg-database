# Establish link between compiled tables and original tables and fields

database_dictionary:
  field:
    db_table: "database_schema"
    db_field: "field"
database_schema:
  link_table:
    db_table: "schema_table"
    db_field: "schema_table"
project:
  originator:
    db_table: "organization"
    db_field: "organization"
    definition: "Abbreviated name of the primary organization that collected the project data"
  funder:
    db_table: "organization"
    db_field: "organization"
    definition: "Abbreviated name of the primary organization that funded the project"
  manager:
    db_table: "personnel"
    db_field: "personnel"
    definition: "First and last name of the primary person responsible for leading the project or managing the project data"
  project_status:
    db_table: "completion"
    db_field: "competion"
